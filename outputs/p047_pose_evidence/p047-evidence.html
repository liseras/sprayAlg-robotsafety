  <script>
    (() => {
      const root = document.getElementById('p047-evidence');
      const d = JSON.parse(document.getElementById('p047-data').textContent);
      const controls = document.getElementById('p047-index');
      const current = document.getElementById('p047-current');
      const detail = document.getElementById('p047-detail');
      const plots = [document.getElementById('p047-fixed'), document.getElementById('p047-flex')];
      document.getElementById('p047-fixed-count').textContent = d.fixedMiss + ' 点有落点告警';
      document.getElementById('p047-flex-count').textContent = d.flexMiss + ' 点有落点告警';
      controls.max = d.points.length - 1;
      controls.value = d.sample;
      function paint(canvas, field, selected) {
        const css = getComputedStyle(root);
        const color = name => css.getPropertyValue(name).trim();
        const width = canvas.clientWidth, height = canvas.clientHeight;
        if (!width || !height) return;
        const scale = window.devicePixelRatio || 1;
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);
        const margin = { left: 46, right: 11, top: 12, bottom: 35 };
        const w = width - margin.left - margin.right, h = height - margin.top - margin.bottom;
        const px = y => margin.left + (y + 1060) * w / 750;
        const py = z => margin.top + (1130 - z) * h / 700;
        ctx.font = css.font;
        ctx.lineWidth = 1;
        ctx.strokeStyle = color('--border');
        ctx.beginPath();
        for (const y of [-1000, -800, -600, -400]) {
          ctx.moveTo(px(y), margin.top);
          ctx.lineTo(px(y), margin.top + h);
        }
        for (const z of [500, 700, 900, 1100]) {
          ctx.moveTo(margin.left, py(z));
          ctx.lineTo(margin.left + w, py(z));
        }
        ctx.stroke();
        ctx.fillStyle = color('--muted-foreground');
        ctx.textAlign = 'center';
        for (const y of [-1000, -800, -600, -400]) ctx.fillText(y, px(y), height - 18);
        ctx.fillText('Y (mm)', margin.left + w / 2, height - 1);
        ctx.textAlign = 'right';
        for (const z of [500, 700, 900, 1100]) ctx.fillText(z, margin.left - 6, py(z) + 4);
        ctx.textAlign = 'left';
        ctx.fillText('Z (mm)', margin.left, margin.top - 1);
        ctx.globalAlpha = .24;
        for (const [y,z] of d.cloud) ctx.fillRect(px(y),py(z),1.6,1.6);
        for (const p of d.points) if (p[3]) ctx.fillRect(px(p[1]),py(p[2]),1.2,1.2);
        ctx.globalAlpha = .82;
        ctx.fillStyle = color('--red');
        ctx.beginPath();
        for (const p of d.points) if (p[field]) {
          ctx.moveTo(px(p[1])+2.25,py(p[2]));
          ctx.arc(px(p[1]),py(p[2]),2.25,0,Math.PI*2);
        }
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = color('--blue');
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px(selected[1]),py(selected[2]),5.5,0,Math.PI*2);
        ctx.stroke();
      }
      function render() {
        const index = Number(controls.value), p = d.points[index];
        if (!p) return;
        current.value = '#' + index;
        const axis = (i) => p.slice(i, i + 3).map(v => v.toFixed(4)).join(', ');
        detail.textContent = 'TCP (' + p.slice(0,3).map(v=>v.toFixed(3)).join(', ') + ') mm · 固定 IJK (' + axis(7)
          + ') · 灵活 IJK (' + axis(10) + ') · 枪轴差 ' + p[6].toFixed(2) + '° · '
          + (p[3] ? '落点告警 ' + (p[4] ? '有' : '无') + ' → ' + (p[5] ? '有' : '无') : '空移点');
        paint(plots[0],4,p);
        paint(plots[1],5,p);
      }
      controls.addEventListener('input',render);
      const size = new ResizeObserver(render);
      for (const plot of plots) size.observe(plot);
      new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
      render();
    })();
  </script>
